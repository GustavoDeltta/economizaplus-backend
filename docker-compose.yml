services:
  db:
    image: postgres:15
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoplusteam}
      POSTGRES_DB: ${POSTGRES_DB:-economizaplus}
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/src/infrastructure/prisma/generated
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata: